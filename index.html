<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Me</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(0, 150, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.5);
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px) translateX(0px);
                opacity: 0.3;
            }
            25% {
                transform: translateY(-50px) translateX(30px);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-20px) translateX(-20px);
                opacity: 0.4;
            }
            75% {
                transform: translateY(-70px) translateX(10px);
                opacity: 0.7;
            }
        }

        .main-container {
            max-width: 500px;
            width: 100%;
            margin: 20px auto;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 30px 25px;
            position: relative;
            z-index: 1;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(0, 150, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .main-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 32px;
            background: linear-gradient(45deg, #0066ff, #0044cc, #0099ff, #0066ff);
            background-size: 400% 400%;
            animation: gradientBorder 4s ease infinite;
            z-index: -1;
            opacity: 0.7;
        }

        .main-container::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: 31px;
            background: #0a0a0a;
            z-index: -1;
            margin: 3px;
        }

        @keyframes gradientBorder {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .profile-section {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #0099ff;
            box-shadow:
                0 0 25px rgba(0, 150, 255, 0.6),
                0 0 50px rgba(0, 150, 255, 0.3);
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #0099ff;
            animation: pulseGlow 2s infinite;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 25px rgba(0, 150, 255, 0.6), 0 0 50px rgba(0, 150, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(0, 150, 255, 0.9), 0 0 80px rgba(0, 150, 255, 0.5);
            }
        }

        .online-status {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            background: #2ecc71;
            border: 3px solid #0a0a0a;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(46, 204, 113, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(46, 204, 113, 0);
            }
        }

        .username {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin: 10px 0 5px 0;
            text-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
            letter-spacing: 1px;
        }

        .title {
            color: #0099ff;
            font-size: 14px;
            margin: 5px 0;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .music-section {
            margin: 20px 0;
            padding: 15px;
            background: rgba(20, 20, 20, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .music-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0099ff;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .equalizer {
            display: flex;
            gap: 2px;
            height: 20px;
            align-items: flex-end;
        }

        .bar {
            width: 3px;
            height: 15px;
            background: #0099ff;
            border-radius: 3px;
            animation: equalize 1s infinite ease-in-out;
        }

        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.3s; }
        .bar:nth-child(3) { animation-delay: 0.5s; }
        .bar:nth-child(4) { animation-delay: 0.7s; }

        @keyframes equalize {
            0%, 100% { height: 8px; }
            50% { height: 20px; }
        }

        .song-name {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin: 5px 0;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.3);
        }

        .song-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .song-controls button {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px;
            border-radius: 50%;
        }

        .song-controls button:hover {
            color: #0099ff;
            text-shadow: 0 0 15px rgba(0, 150, 255, 0.6);
        }

        .song-controls button.play-btn {
            background: #0099ff;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            box-shadow: 0 5px 20px rgba(0, 150, 255, 0.5);
        }

        .song-controls button.play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(0, 150, 255, 0.8);
        }

        .links-section {
            margin: 20px 0;
        }

        /* Team Company - Special Big Card */
        .link-team {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            margin-bottom: 15px;
            background: rgba(0, 150, 255, 0.08);
            border: 1px solid rgba(0, 150, 255, 0.3);
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .link-team::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .link-team:hover::before {
            opacity: 1;
        }

        .link-team:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(0, 150, 255, 0.6);
            box-shadow: 0 10px 40px rgba(0, 150, 255, 0.25);
            background: rgba(0, 150, 255, 0.12);
        }

        .link-team .team-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: brightness(0) saturate(100%) invert(47%) sepia(96%) saturate(417%) hue-rotate(187deg) brightness(100%) contrast(101%);
            transition: all 0.4s ease;
            position: relative;
            z-index: 1;
        }

        .link-team:hover .team-logo {
            filter: brightness(0) saturate(100%) invert(66%) sepia(60%) saturate(1000%) hue-rotate(187deg) brightness(105%) contrast(105%);
            transform: scale(1.1);
        }

        .link-team .team-text {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
        }

        .link-team .team-arrow {
            color: #0099ff;
            font-size: 18px;
            position: relative;
            z-index: 1;
            transition: all 0.4s ease;
        }

        .link-team:hover .team-arrow {
            transform: translateX(8px);
        }

        /* Regular Links - No Icons */
        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(20, 20, 20, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            text-decoration: none;
            color: #ddd;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .link-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 2px;
            height: 100%;
            background: #0099ff;
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .link-item:hover::before {
            transform: scaleY(1);
        }

        .link-item:hover {
            transform: translateX(5px);
            border-color: rgba(0, 150, 255, 0.3);
            background: rgba(30, 30, 30, 0.8);
            color: #fff;
            box-shadow: 0 5px 20px rgba(0, 150, 255, 0.1);
        }

        .link-item .link-text {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .link-item .link-arrow {
            font-size: 12px;
            color: #555;
            transition: all 0.3s ease;
        }

        .link-item:hover .link-arrow {
            color: #0099ff;
            transform: translateX(3px);
        }

        .social-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 5px 0;
            flex-wrap: wrap;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 15px;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.4), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .social-btn:hover::after {
            opacity: 1;
        }

        .social-btn:hover {
            transform: translateY(-5px) rotate(5deg);
            box-shadow: 0 15px 35px rgba(0, 150, 255, 0.4);
            border-color: #0099ff;
            color: #fff;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 150, 255, 0.2);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 150, 255, 0.4);
            color: #fff;
            padding: 12px 30px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            margin-right: 10px;
            color: #0099ff;
        }

        @media (max-width: 480px) {
            .main-container {
                margin: 10px;
                padding: 20px 15px;
                border-radius: 20px;
            }

            .username {
                font-size: 24px;
            }

            .social-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .links-grid {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .link-team {
                padding: 16px;
            }

            .link-team .team-logo {
                width: 40px;
                height: 40px;
            }

            .link-team .team-text {
                font-size: 17px;
            }
        }

        #overlay {
            backdrop-filter: blur(100px);
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 20px;
            z-index: 9999;
            cursor: pointer;
        }

        #overlay {
        backdrop-filter: blur(100px);
        -webkit-backdrop-filter: blur(100px);
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(10, 10, 10, 0.95);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-size: 20px;
        z-index: 9999;
        cursor: pointer;
    
        opacity: 1;
        transition: opacity 0.8s ease, filter 0.8s ease, backdrop-filter 0.8s ease;
    }

    #overlay.hidden {
        opacity: 0;
        filter: blur(20px);
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
        pointer-events: none;
    }
    </style>
</head>

    <script>

        function startExperience() {
            loadSong(0);
            playSong();
            document.getElementById('overlay').style.display = 'none';
            overlay.classList.add('hidden');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 800);
        }
        
        // Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Copy Discord Username
        function copyDiscordUsername() {
            const username = 'enesrameds';
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(username).then(() => {
                    showToast('Discord username copied! ✅');
                }).catch(() => {
                    fallbackCopy(username);
                });
            } else {
                fallbackCopy(username);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast('Discord username copied! ✅');
            } catch (err) {
                showToast('Failed to copy!');
            }
            
            document.body.removeChild(textarea);
        }

        // Create Particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');

                const size = Math.random() * 8 + 3;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 8 + 4) + 's';
                particle.style.animationDelay = (Math.random() * 5) + 's';

                particlesContainer.appendChild(particle);
            }
        }

        createParticles();

        // Music Player Functions
        const audioPlayer = document.getElementById('audioPlayer');
        const songNameDisplay = document.getElementById('songName');
        const playBtn = document.getElementById('playBtn');

        let isPlaying = false;
        let currentSongIndex = 0;

        const playlist = [
            { name: 'admiringYou', url: 'https://files.catbox.moe/jnle6f.mp3' },
            { name: 'eighteen', url: 'https://files.catbox.moe/mkp69o.mp3' },
            { name: 'iKissYourLips', url: 'https://files.catbox.moe/74t0gg.mp3' },
            { name: 'misery', url: 'https://files.catbox.moe/k4naf2.mp3' },
            { name: 'trustMe', url: 'https://files.catbox.moe/oaiupy.mp3' },
        ];

        function loadSong(index) {
            if (index >= 0 && index < playlist.length) {
                audioPlayer.src = playlist[index].url;
                songNameDisplay.textContent = '♪ ' + playlist[index].name + ' ♪';
            }
        }

        function togglePlay() {
            if (isPlaying) {
                pauseSong();
            } else {
                playSong();
            }
        }

        function playSong() {
            if (!audioPlayer.src || audioPlayer.src === window.location.href) {
                loadSong(currentSongIndex);
            }
            
            audioPlayer.play().then(() => {
                isPlaying = true;
                updatePlayButton();
            }).catch(err => {
                console.log('Playback error:', err);
            });
        }

        function pauseSong() {
            audioPlayer.pause();
            isPlaying = false;
            updatePlayButton();
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) {
                audioPlayer.play();
            }
        }

        function previousSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) {
                audioPlayer.play();
            }
        }

        function updatePlayButton() {
            const icon = playBtn.querySelector('i');
            if (isPlaying) {
                icon.className = 'fas fa-pause';
                playBtn.style.background = '#00ccff';
                playBtn.style.boxShadow = '0 5px 20px rgba(0, 204, 255, 0.5)';
            } else {
                icon.className = 'fas fa-play';
                playBtn.style.background = '#0099ff';
                playBtn.style.boxShadow = '0 5px 20px rgba(0, 150, 255, 0.5)';
            }
        }

        audioPlayer.addEventListener('ended', function() {
            nextSong();
            if (isPlaying) {
                audioPlayer.play();
            }
        });

        window.addEventListener('load', function() {
            loadSong(0);
            setTimeout(function() {
                playSong();
            });
        });

        document.addEventListener('click', function() {
            if (!isPlaying && audioPlayer.src) {
                playSong();
            }
        }, { once: true });
    </script>
</body>
</html>
