<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Me</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #241b12;
            font-family: 'Courier New', Courier, monospace;
            color: #e8dcc8;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 520px;
            margin: 20px auto;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 30px 10px;
            max-height: 95vh;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            body {
                overflow-y: auto;
                height: auto;
                align-items: flex-start;
            }

            .main-container {
                max-height: none;
                overflow: visible;
                margin: 10px;
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 30px;
            }

            .social-btn {
                width: 40px;
                height: 40px;
                font-size: 17px;
            }

            .photo-row {
                justify-content: center;
                text-align: center;
            }

            .side-note {
                border-left: none;
                padding-left: 0;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-small {
            font-size: 13px;
            letter-spacing: 2px;
            color: #c8a878;
            text-transform: uppercase;
        }

        .header h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 38px;
            color: #f0e2c8;
            margin-top: 4px;
            text-shadow: 2px 2px 0 #4a3520;
        }

        .photo-row {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .sticky-note {
            background: #f4ead2;
            padding: 10px;
            transform: rotate(-3deg);
            box-shadow: 4px 6px 0 rgba(0, 0, 0, 0.35);
            width: 150px;
            flex-shrink: 0;
            position: relative;
        }

        .sticky-note::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(-4deg);
            width: 60px;
            height: 18px;
            background: rgba(217, 170, 120, 0.7);
            border-left: 1px dashed rgba(0, 0, 0, 0.15);
            border-right: 1px dashed rgba(0, 0, 0, 0.15);
        }

        .sticky-note img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            display: block;
            filter: sepia(0.25) contrast(1.05);
        }

        .sticky-note .pin {
            display: block;
            width: 12px;
            height: 12px;
            background: #d98a3f;
            border-radius: 50%;
            margin: 0 auto 8px auto;
            box-shadow: 1px 2px 2px rgba(0, 0, 0, 0.4);
        }

        .side-note {
            flex: 1;
            min-width: 160px;
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            color: #c8a878;
            font-size: 15px;
            line-height: 1.5;
            border-left: 2px solid #7a5a38;
            padding-left: 14px;
        }

        .music-section {
            margin: 18px 0;
            padding: 14px;
            background: #241b12;
            border-radius: 6px;
            border: 1px solid #4a3520;
        }

        .music-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #d98a3f;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .equalizer {
            display: flex;
            gap: 2px;
            height: 18px;
            align-items: flex-end;
        }

        .bar {
            width: 3px;
            height: 14px;
            background: #d98a3f;
            border-radius: 2px;
            animation: equalize 1s infinite ease-in-out;
        }

        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.3s; }
        .bar:nth-child(3) { animation-delay: 0.5s; }
        .bar:nth-child(4) { animation-delay: 0.7s; }

        @keyframes equalize {
            0%, 100% { height: 6px; }
            50% { height: 18px; }
        }

        .song-name {
            color: #ddd;
            font-size: 15px;
            font-weight: 600;
            margin: 4px 0;
            text-align: center;
        }

        .song-controls {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 8px;
        }

        .song-controls button {
            background: none;
            border: none;
            color: #a8906a;
            font-size: 17px;
            cursor: pointer;
            padding: 8px;
        }

        .song-controls button:hover {
            color: #d98a3f;
        }

        .song-controls button.play-btn {
            background: #a05a2a;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 18px;
        }

        .section-title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 22px;
            color: #f0e2c8;
            margin: 26px 0 14px 0;
            letter-spacing: 2px;
            border-bottom: 1px dashed #4a3520;
            padding-bottom: 8px;
        }

        .projects {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .project-card {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 18px;
            background: transparent;
            border: 1px solid rgba(217, 138, 63, 0.35);
            border-radius: 8px;
            text-decoration: none;
            color: #f0e2c8;
            transition: all 0.25s ease;
        }

        .project-card:hover {
            border-color: rgba(217, 138, 63, 0.7);
            background: transparent;
            transform: translateY(-3px);
        }

        .project-card img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        .project-card .project-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .link-list {
            margin-top: 8px;
        }

        .link-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            margin-bottom: 8px;
            background: transparent;
            border: 1px solid #4a3520;
            border-radius: 4px;
            text-decoration: none;
            color: #e8dcc8;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .link-row:hover {
            border-color: #d98a3f;
            background: transparent;
            transform: translateX(4px);
        }

        .link-row .num {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 16px;
            color: #a05a2a;
            width: 26px;
            text-align: right;
            letter-spacing: 1px;
        }

        .link-row .link-text {
            flex: 1;
            font-size: 16px;
        }

        .link-row .link-arrow {
            font-size: 12px;
            color: #a8906a;
        }

        .link-row:hover .link-arrow {
            color: #d98a3f;
        }

        .social-section {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 22px 0 5px 0;
        }

        .social-btn {
            width: 46px;
            height: 46px;
            border-radius: 6px;
            background: transparent;
            border: 2px solid #4a3520;
            color: #e8dcc8;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            border-color: #d98a3f;
            color: #d98a3f;
            transform: rotate(-4deg) translateY(-3px);
            box-shadow: 0 4px 0 #4a3520;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: transparent;
            border: 1px solid #d98a3f;
            color: #f0e2c8;
            padding: 11px 26px;
            border-radius: 6px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            margin-right: 8px;
            color: #d98a3f;
        }

    </style>
</head>
<body>

    </div>

    <div class="main-container">

            <div class="header-small">* usually everywhere, enesramed *</div>

        <div class="photo-row">

    </div>

    <script>
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            toastMessage.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function copyDiscordUsername() {
            const username = 'enesrameds';

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(username).then(() => {
                    showToast('Discord username copied');
                }).catch(() => {
                    fallbackCopy(username);
                });
            } else {
                fallbackCopy(username);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
                showToast('Discord username copied');
            } catch (err) {
                showToast('Could not copy');
            }

            document.body.removeChild(textarea);
        }

        const audioPlayer = document.getElementById('audioPlayer');
        const songNameDisplay = document.getElementById('songName');
        const playBtn = document.getElementById('playBtn');

        let isPlaying = false;
        let currentSongIndex = 0;

        const playlist = [
            { name: 'admiringYou', url: 'https://files.catbox.moe/jnle6f.mp3' },
            { name: 'eighteen', url: 'https://files.catbox.moe/mkp69o.mp3' },
            { name: 'iKissYourLips', url: 'https://files.catbox.moe/74t0gg.mp3' },
            { name: 'misery', url: 'https://files.catbox.moe/k4naf2.mp3' },
            { name: 'trustMe', url: 'https://files.catbox.moe/oaiupy.mp3' },
        ];

        function loadSong(index) {
            if (index >= 0 && index < playlist.length) {
                audioPlayer.src = playlist[index].url;
                songNameDisplay.textContent = playlist[index].name;
            }
        }

        function togglePlay() {
            if (isPlaying) {
                pauseSong();
            } else {
                playSong();
            }
        }

        function playSong() {
            if (!audioPlayer.src || audioPlayer.src === window.location.href) {
                loadSong(currentSongIndex);
            }

            audioPlayer.play().then(() => {
                isPlaying = true;
                updatePlayButton();
            }).catch(err => {
                console.log('Playback error:', err);
            });
        }

        function pauseSong() {
            audioPlayer.pause();
            isPlaying = false;
            updatePlayButton();
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) {
                audioPlayer.play();
            }
        }

        function previousSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) {
                audioPlayer.play();
            }
        }

        function updatePlayButton() {
            const icon = playBtn.querySelector('i');
            if (isPlaying) {
                icon.className = 'fas fa-pause';
            } else {
                icon.className = 'fas fa-play';
            }
        }

        audioPlayer.addEventListener('ended', function() {
            nextSong();
            if (isPlaying) {
                audioPlayer.play();
            }
        });

        window.addEventListener('load', function() {
            loadSong(0);
        });
    </script>
</body>
